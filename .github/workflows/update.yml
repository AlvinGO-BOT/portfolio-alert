name: portfolio-update

on:
  schedule:
    # 北京时间 08:00 / 12:00 / 18:10 (UTC 0/4/10), 仅交易日(周一至周五)
    - cron: "0 0 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "10 10 * * 1-5"
  workflow_dispatch:
    inputs:
      type:
        description: "运行类型"
        default: evening
        type: choice
        options: [morning, noon, evening]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run portfolio pipeline
        run: |
          TYPE="${{ github.event.inputs.type || 'auto' }}"
          if [ "$TYPE" = "auto" ]; then
            python3 run_daily.py
          else
            python3 run_daily.py --type "$TYPE"
          fi

      - name: Commit and push
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@github.com"
          git add docs config/portfolio.json
          git add reports/summary_*.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update: $(TZ=Asia/Shanghai date '+%F %H:%M') ${TYPE:-auto}"
            git push
          fi
